resources:
  pipelines:
    pip_core_banca_to_bronze:
      name: pip_core_banca_to_bronze
      ingestion_definition:
        connection_name: cn_utec_banca
        objects:
          - table:
              source_catalog: postgres
              source_schema: public
              source_table: cliente
              destination_catalog: dev_bronze
              destination_schema: core_banca
              table_configuration:
                scd_type: SCD_TYPE_2
                primary_keys:
                  - cliente_id
                query_based_connector_config:
                  cursor_columns:
                    - fec_modificacion
          - table:
              source_catalog: postgres
              source_schema: public
              source_table: cuenta
              destination_catalog: dev_bronze
              destination_schema: core_banca
              table_configuration:
                primary_keys:
                  - cuenta_id
                query_based_connector_config:
                  cursor_columns:
                    - fec_modificacion
          - table:
              source_catalog: postgres
              source_schema: public
              source_table: prestamo
              destination_catalog: dev_bronze
              destination_schema: core_banca
              table_configuration:
                scd_type: SCD_TYPE_2
                primary_keys:
                  - prestamo_id
                query_based_connector_config:
                  cursor_columns:
                    - fec_modificacion
          - table:
              source_catalog: postgres
              source_schema: public
              source_table: cuota
              destination_catalog: dev_bronze
              destination_schema: core_banca
              table_configuration:
                primary_keys:
                  - cuota_id
                query_based_connector_config:
                  cursor_columns:
                    - fec_modificacion
        source_type: POSTGRESQL
      schema: core_banca
      channel: PREVIEW
      catalog: dev_bronze
