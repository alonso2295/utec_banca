# This is a Declarative Automation Bundle definition for e2e_banca.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: e2e_banca
  uuid: ad687afa-f2b9-4a15-a905-7c663baaf6bf

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405608574605649.9.azuredatabricks.net
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405608574605649.9.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/alonso229@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/alonso229/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: alonso229@hotmail.com
        level: CAN_MANAGE
